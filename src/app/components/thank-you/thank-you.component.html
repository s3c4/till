<section class="container mx-auto px-4 md:px-16">
    <h1 class="text-center text-[#111111] text-[55px] font-bold">Thank you</h1>
    <p *ngIf="basket.length > 0" class="my-8">You can check below the list of your items:</p>
    <ul class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-[25px] mb-8">
        <li *ngFor="let b of basket" class="flex flex-col justify-between shadow-xl rounded-2xl bg-white p-[20px]">
            <app-product-card [product]="b.product"></app-product-card>
        </li>
    </ul>
    <p *ngIf="basket.length === 0">Nothing to show.</p>
</section>
